<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pradhap R | Portfolio</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #050b12;
            color: white;
            overflow-x: hidden;
        }

<img src="pn.jpg" alt="Pradhap R">

        /* NAVBAR */
        header {
            height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: #080e16;
            border-bottom: 1px solid #26313d;
            position: relative;
            z-index: 10;
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
        }

        .logo span,
        h1 span {
            color: #ff3030;
        }

        nav {
            display: flex;
            gap: 45px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 30px 0;
        }

        nav a:hover,
        nav a.active {
            color: #ff3030;
        }

        /* HERO */
        .hero {
            min-height: calc(100vh - 90px);
            display: flex;
            position: relative;
            overflow: hidden;
        }

        .hero-text {
            width: 55%;
            padding: 145px 0 50px 7%;
            position: relative;
            z-index: 3;
        }

        .hello {
            font-size: 32px;
            margin-bottom: 5px;
        }

        h1 {
            font-size: 82px;
            line-height: 1;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 28px;
            font-weight: normal;
            color: #cbd4df;
        }

        .red-line {
            width: 82px;
            height: 4px;
            background: #ff3030;
            margin: 35px 0 25px;
        }

        .description {
            font-size: 20px;
            line-height: 1.6;
            color: #d2d8df;
            max-width: 520px;
        }

        /* SKILLS */
        .skills {
            display: flex;
            gap: 15px;
            margin-top: 32px;
            flex-wrap: wrap;
        }

        .skill {
            border: 1px solid #52606f;
            border-radius: 8px;
            padding: 13px 25px;
            font-size: 17px;
            background: rgba(10, 20, 30, 0.7);
        }

        /* BUTTON */
        .project-btn {
            display: inline-block;
            margin-top: 35px;
            padding: 16px 28px;
            border: 2px solid #ff3030;
            border-radius: 7px;
            color: white;
            text-decoration: none;
            font-size: 18px;
            transition: 0.3s;
        }

        .project-btn:hover {
            background: #ff3030;
        }

        /* PHOTO */
        .hero-photo {
            width: 50%;
            position: absolute;
            right: 0;
            top: 0;
            height: 100%;
            overflow: hidden;
        }

        .hero-photo::before {
            content: "";
            position: absolute;
            left: -180px;
            top: 0;
            width: 400px;
            height: 100%;
            background: linear-gradient(
                to right,
                #050b12 15%,
                rgba(5,11,18,0.8) 50%,
                transparent
            );
            z-index: 2;
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
        }

        /* RED DESIGN */
        .red-shape {
            position: absolute;
            right: -100px;
            top: 0;
            width: 180px;
            height: 100%;
            background: #d9212b;
            transform: skewX(-25deg);
            opacity: 0.85;
            z-index: 1;
        }

        /* SOCIAL */
        .social {
            position: absolute;
            bottom: 40px;
            left: 7%;
            display: flex;
            gap: 25px;
            z-index: 5;
        }

        .social a {
            width: 45px;
            height: 45px;
            border: 1px solid #788492;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-decoration: none;
            font-size: 18px;
        }

        .social a:hover {
            border-color: #ff3030;
            color: #ff3030;
        }

        /* MOBILE */
        @media (max-width: 768px) {

            header {
                height: auto;
                padding: 20px;
                flex-direction: column;
                gap: 20px;
            }

            .logo {
                font-size: 25px;
            }

            nav {
                gap: 18px;
                flex-wrap: wrap;
                justify-content: center;
            }

            nav a {
                font-size: 15px;
                padding: 0;
            }

            .hero {
                min-height: auto;
                flex-direction: column;
            }

            .hero-text {
                width: 100%;
                padding: 70px 25px 40px;
                text-align: center;
            }

            .hello {
                font-size: 25px;
            }

            h1 {
                font-size: 50px;
            }

            h2 {
                font-size: 20px;
            }

            .red-line {
                margin: 25px auto;
            }

            .description {
                font-size: 17px;
                margin: auto;
            }

            .skills {
                justify-content: center;
            }

            .skill {
                padding: 10px 16px;
                font-size: 14px;
            }

            .hero-photo {
                position: relative;
                width: 100%;
                height: 550px;
            }

            .hero-photo::before {
                left: 0;
                top: -150px;
                width: 100%;
                height: 250px;
                background: linear-gradient(
                    to bottom,
                    #050b12,
                    transparent
                );
            }

            .social {
                position: relative;
                left: auto;
                bottom: auto;
                justify-content: center;
                padding: 25px;
            }
        }
    </style>
</head>

            </h2>

            <div class="red-line"></div>

            <p class="description">

            <div class="skills">

                <div class="skill">☕ Java</div>

                <div class="skill">🌐 HTML</div>
